name: Build and publish the viewer

on:
  push:
    branches:
      - main
    paths:
      - "inbox/**/condensation.json"
      - "scripts/**"
      - "tests/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "sessions/**"
      - "assets/**"
      - "Energy Resilience/**"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test and compile approved condensations
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/parliament_pipeline.py build

      - name: Commit generated sessions
        run: |
          git config user.name "parliament-transcript-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if [ -d sessions/generated ]; then
            git add sessions/generated
          fi
          if git diff --cached --quiet; then
            echo "Generated website files are already current."
          else
            git commit -m "Publish approved committee condensations"
            git push
          fi

      - name: Close completed condensation issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/parliament_pipeline.py issues --close-approved

      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css NOTICE.md _site/
          cp -R sessions assets "Energy Resilience" _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
