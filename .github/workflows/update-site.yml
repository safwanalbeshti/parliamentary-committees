name: Discover, condense and publish

on:
  schedule:
    # 23:17 UTC: after the day's publications, away from the top of the hour
    # when scheduled Actions queue.
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many publication days to check"
        required: false
        default: "7"

concurrency:
  group: update-site
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out the project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download and prepare new transcript packets
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
        run: python3 scripts/parliament_pipeline.py sync --lookback-days "$LOOKBACK_DAYS"

      - name: Condense new transcripts with GPT-5 mini
        env:
          CONDENSE_API_KEY: ${{ secrets.CONDENSE_API_KEY }}
        run: python3 scripts/parliament_pipeline.py condense

      - name: Test and compile condensations
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/parliament_pipeline.py build

      - name: Commit packets and generated sessions
        run: |
          git config user.name "parliament-transcript-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          for path in inbox sessions/generated; do
            if [ -d "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "The site is already current."
          else
            git commit -m "Publish newly condensed committee sessions"
            git push
          fi

      - name: Flag failed condensations and close completed issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/parliament_pipeline.py issues --close-approved

      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css NOTICE.md _site/
          cp -R sessions assets "Energy Resilience" _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
